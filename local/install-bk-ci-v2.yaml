apiVersion: batch/v1
kind: Job
metadata:
  name: bk-ci-bk-ci-init-sql
  labels:
    helm.sh/chart: bk-ci-v3.2.0
    app.kubernetes.io/instance: bk-ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: init-sql
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        helm.sh/chart: bk-ci-v3.2.0
        app.kubernetes.io/instance: bk-ci
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: init-sql
    spec:
      
      imagePullSecrets:
        - name: fronted-cn-beijing
      initContainers:
        - name: wait-for-mysql
          image: fronted-cn-beijing.cr.volces.com/container/bkci/bkci-backend:v3.2.0
          imagePullPolicy: IfNotPresent
          
          command:
            - "/bin/sh"
            - "-c"
            - |
              while ! mysql -uroot -pblueking -hbk-ci-mysql -P3306; do
                echo "mysql connecting.."
                sleep 3
              done
              echo "MySQL is available";
      containers:
        - name: init-sql
          image: fronted-cn-beijing.cr.volces.com/container/bkci/bkci-backend:v3.2.0
          imagePullPolicy: IfNotPresent
          workingDir: /data/workspace/support-files/sql
          
          command:
            - "/bin/bash"
            - "-c"
            - |
              find . -type f -name "*.sql" | sort | while read SQL; do
                echo "Importing $SQL ..."
                mysql -uroot -pblueking -hbk-ci-mysql -P3306 < $SQL
              done
              echo 'DELETE FROM devops_ci_store.T_CONTAINER WHERE ID = "d51a712508c011e99792fa163e50f2b5";'|mysql -uroot -pblueking -hbk-ci-mysql -P3306
              echo 'update devops_ci_store.T_BUSINESS_CONFIG set CONFIG_VALUE="DOCKER" WHERE BUSINESS_VALUE="LINUX" AND FEATURE="defaultBuildType";'|mysql -uroot -pblueking -hbk-ci-mysql -P3306
      restartPolicy: OnFailure
