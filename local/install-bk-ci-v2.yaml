apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: bk-ci-bk-ci-artifactory
  labels:
    helm.sh/chart: bk-ci-v3.2.0
    app.kubernetes.io/instance: bk-ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: microservice
    app.kubernetes.io/name: artifactory
spec:
  
  selector:
    matchLabels:
      app.kubernetes.io/instance: bk-ci
      app.kubernetes.io/component: microservice
      app.kubernetes.io/name: artifactory
  replicas: 1 
  
  serviceName: bk-ci-bk-ci-artifactory
  
  template:
    metadata:
      labels:
        helm.sh/chart: bk-ci-v3.2.0
        app.kubernetes.io/instance: bk-ci
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: microservice
        app.kubernetes.io/name: artifactory
    spec:
      
      imagePullSecrets:
        - name: fronted-cn-beijing
      serviceAccountName: bkci
      affinity:
        podAffinity:
          
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: bk-ci
                    app.kubernetes.io/name: bk-ci
                topologyKey: kubernetes.io/hostname
              weight: 1
        nodeAffinity:
          
      initContainers:
        - name: wait-for-mysql
          image: fronted-cn-beijing.cr.volces.com/container/bkci/bkci-backend:v3.2.0
          imagePullPolicy: IfNotPresent
          
          command:
            - "/bin/sh"
            - "-c"
            - |
              while ! mysql -uroot -pblueking -hbk-ci-mysql -P3306; do
                echo "mysql connecting.."
                sleep 3
              done
              echo "MySQL is available";
      containers:
        - name: artifactory
          image: fronted-cn-beijing.cr.volces.com/container/bkci/bkci-backend:v3.2.0
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 500m
              memory: 1500Mi
            requests:
              cpu: 100m
              memory: 1000Mi
          ports:
            - name: http
              containerPort: 80
          env:
            - name: MS_NAME
              value: artifactory
            - name: NAMESPACE
              value: bk-ck
            - name: RELEASE_NAME
              value: bk-ci
            - name: CHART_NAME
              value: bk-ci
            - name: MULTI_CLUSTER
              value: "false"
            - name: DEFAULT_NAMESPACE
              value: 
            - name: JAVA_TOOL_OPTIONS
              value:  -XX:InitialRAMPercentage=70.0 -XX:MaxRAMPercentage=70.0
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
          workingDir: /data/workspace/artifactory
          
          command:
            - "/bin/bash"
            - "-c"
            - |
              if [ ! -d "/data1/artifactory/file" ]; then
                mkdir -p /data1/artifactory;
                cp -r -n /data/workspace/support-files/file /data1/artifactory/file;
              fi;
              cp /data/workspace/backend.bkci.sh .;
              mkdir -p /data/dir;
              ln -s /data1/artifactory /data/dir/artifactory;
              /bin/bash backend.bkci.sh;
          
          livenessProbe:
            httpGet:
              path: /management/health/livenessState
              port: http
            initialDelaySeconds: 50
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 20
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /management/health/readinessState
              port: http
            initialDelaySeconds: 50
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 20
            successThreshold: 1
          volumeMounts:
            - name: storage
              mountPath: /data1
            - mountPath: /data/workspace/dispatch/jvm
              name: log-volume
              subPathExpr: bkci/jvm/$(POD_NAME)
          lifecycle:
              preStop:
                exec:
                  command:
                  - /bin/bash
                  - -c
                  - sleep 20 && ps -ef|grep java|grep -v grep|awk '{print $2}'|xargs kill -15
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: bk-ci-bk-ci-storage
        - hostPath:
            path: /data
          name: log-volume
