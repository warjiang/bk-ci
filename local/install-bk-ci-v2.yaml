    app.kubernetes.io/instance: bk-ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: microservice
    app.kubernetes.io/name: auth
spec:
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/instance: bk-ci
      app.kubernetes.io/component: microservice
      app.kubernetes.io/name: auth
  replicas: 1
  template:
    metadata:
      labels:
        helm.sh/chart: bk-ci-v3.2.0
        app.kubernetes.io/instance: bk-ci
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: microservice
        app.kubernetes.io/name: auth
    spec:
      
      imagePullSecrets:
        - name: fronted-cn-beijing
      serviceAccountName: bkci
      affinity:
        podAffinity:
          
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: bk-ci
                    app.kubernetes.io/name: bk-ci
                topologyKey: kubernetes.io/hostname
              weight: 1
        nodeAffinity:
          
      initContainers:
        - name: wait-for-mysql
          image: fronted-cn-beijing.cr.volces.com/container/bkci/bkci-backend:v3.2.0
          imagePullPolicy: IfNotPresent
          
          command:
            - "/bin/sh"
            - "-c"
            - |
              while ! mysql -uroot -pblueking -hbk-ci-mysql -P3306; do
                echo "mysql connecting.."
                sleep 3
              done
              echo "MySQL is available";
      containers:
        - name: auth
          image: fronted-cn-beijing.cr.volces.com/container/bkci/bkci-backend:v3.2.0
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 500m
              memory: 1500Mi
            requests:
              cpu: 100m
              memory: 1000Mi
          ports:
            - name: http
              containerPort: 80
          env:
            - name: MS_NAME
              value: auth
            - name: NAMESPACE
              value: bk-ck
            - name: RELEASE_NAME
              value: bk-ci
            - name: CHART_NAME
              value: bk-ci
            - name: MULTI_CLUSTER
              value: "false"
            - name: DEFAULT_NAMESPACE
              value: 
            - name: JAVA_TOOL_OPTIONS
              value:  -XX:InitialRAMPercentage=70.0 -XX:MaxRAMPercentage=70.0
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
          workingDir: /data/workspace/auth
          
          command:
            - "/bin/bash"
            - "-c"
            - |
              cp /data/workspace/backend.bkci.sh .;
              /bin/bash backend.bkci.sh;
          
          livenessProbe:
            httpGet:
              path: /management/health/livenessState
              port: http
            initialDelaySeconds: 50
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 20
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /management/health/readinessState
              port: http
            initialDelaySeconds: 50
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 20
            successThreshold: 1
          volumeMounts:
          - mountPath: /data/workspace/auth/jvm
            name: log-volume
            subPathExpr: bkci/jvm/$(POD_NAME)
          lifecycle:
              preStop:
                exec:
                  command:
                  - /bin/bash
                  - -c
                  - sleep 20 && ps -ef|grep java|grep -v grep|awk '{print $2}'|xargs kill -15
      volumes:
      - hostPath:
          path: /data
        name: log-volume
