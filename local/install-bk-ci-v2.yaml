          image: fronted-cn-beijing.cr.volces.com/container/bkci/bkci-frontend:v3.2.0
          volumeMounts:
          - mountPath: /tmp/frontend
            name: frontend
          command:
            - "/bin/sh"
            - "-c"
            - |
              cp -r /data/workspace/frontend/* /tmp/frontend/
      containers:
        - name: gateway
          image: fronted-cn-beijing.cr.volces.com/container/bkci/bkci-gateway:v3.2.0
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 500m
              memory: 800Mi
            requests:
              cpu: 100m
              memory: 500Mi
          ports:
            - name: http
              containerPort: 80
          env:
            - name: MS_NAME
              value: gateway
            - name: NAMESPACE
              value: bk-ck
            - name: RELEASE_NAME
              value: bk-ci
            - name: CHART_NAME
              value: bk-ci
            - name: MULTI_CLUSTER
              value: "false"
            - name: DEFAULT_NAMESPACE
              value: 
