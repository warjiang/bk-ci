apiVersion: batch/v1
kind: Job
metadata:
  name: kubernetes-manager-init-sql
  labels:
    app.kubernetes.io/component: init-sql
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "100"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/component: init-sql
    spec:
      
      imagePullSecrets:
        - name: fronted-cn-beijing
      containers:
        - name: init-sql
          image: fronted-cn-beijing.cr.volces.com/container/bkci/bkci-kubernetes-manager:0.0.32
          imagePullPolicy: IfNotPresent
          workingDir: /data/workspace/support-files/sql
          
          command:
            - "/bin/sh"
            - "-c"
            - |
              for SQL in *.sql; do mysql -uroot -pblueking -hbk-ci-mysql -P3306< $SQL; done ;
      restartPolicy: OnFailure
