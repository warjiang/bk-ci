kind: Job
metadata:
  name: bk-ci-bk-ci-init-default-image
  labels:
    helm.sh/chart: bk-ci-v3.2.0
    app.kubernetes.io/instance: bk-ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: init-default-image
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        helm.sh/chart: bk-ci-v3.2.0
        app.kubernetes.io/instance: bk-ci
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: init-default-image
    spec:
      
      imagePullSecrets:
        - name: fronted-cn-beijing
      containers:
        - name: init-default-image
          image: fronted-cn-beijing.cr.volces.com/container/bkci/bkci-backend:v3.2.0
          imagePullPolicy: IfNotPresent
          workingDir: /data/workspace/
          command:
            - "/bin/bash"
            - "-c"
            - |
              services="store project auth"
              for service in $services
              do
                until curl --connect-timeout 3 -m 1 -s "http://bk-ci-bk-ci-$service.bk-ck.svc.cluster.local" > nohup
                do 
                  echo "waiting for bk-ci-bk-ci-$service";
                  sleep 2;
                done
                echo "bk-ci-bk-ci-$service is available";
              done

              echo "bk-ci-bk-ci-store is available";
              curl "http://bk-ci-bk-ci-store.bk-ck.svc.cluster.local/api/op/market/image/init" -X POST -d '{"imageRepoName":"registry-1.docker.io/bkci/ci" , "imageTag":"latest"}'
      restartPolicy: OnFailure
