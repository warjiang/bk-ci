# Source: bk-ci/charts/kubernetes-manager/templates/dockerInit.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatch-kubernetes-builder
  namespace: bk-ck
data:
  initsh.properties: |    #!/bin/bash
    set -x
    
    mkdir  -p /data/devops
    cd /data/devops
    
    mkdir -p logs
    echo "start to download the docker_init.sh..." > logs/docker.log
    
    curl -k -s -H "X-DEVOPS-BUILD-TYPE: DOCKER" -H "X-DEVOPS-PROJECT-ID: ${devops_project_id}" -H "X-DEVOPS-AGENT-ID: ${devops_agent_id}" -H "X-DEVOPS-AGENT-SECRET-KEY: ${devops_agent_secret_key}" -o  docker_init.sh "${devops_gateway}/static/local/files/docker_init.sh" -L
    
    echo docker_init
    cat docker_init.sh
    
    echo "download docker_init.sh success, start it..." >> logs/docker.log
    
    if [ -d "/data/bkdevops/apps/jdk/KonaJDK8_landun" ]; then
      echo "local /data/bkdevops/apps/jdk/KonaJDK8_landun is exsited,copy jre to /usr/local/jre" > logs/docker.log
      cp -r /data/bkdevops/apps/jdk/KonaJDK8_landun /usr/local/jre >> logs/docker.log 2>&1
    else
      echo "local /data/bkdevops/apps/jdk/KonaJDK8_landun is not exsited." > logs/docker.log
    fi
    
    ## Download the docker.jar
    echo "start to download the docker.jar..." >> logs/docker.log
    
    curl -k -s -H "X-DEVOPS-BUILD-TYPE: DOCKER" -H "X-DEVOPS-PROJECT-ID: ${devops_project_id}" -H "X-DEVOPS-AGENT-ID: ${devops_agent_id}" -H "X-DEVOPS-AGENT-SECRET-KEY: ${devops_agent_secret_key}"  -o docker.jar "${devops_gateway}/static/local/files/jar/worker-agent.jar"
    
    echo "download the docker.jar finished, ready to start it..." >> logs/docker.log
    md5sum docker.jar >> logs/docker.log 2>&1
    fileSize=`wc -c docker.jar | awk '{print $1}'`
    echo $fileSize >> logs/docker.log
    if [ "$fileSize" -lt 102400 ]
    then
        cat docker.jar >> logs/docker.log
    fi
    
    random_string=$(head /dev/urandom | tr -dc A-Za-z0-9 | head -c 16)
    
    /usr/local/jre/bin/java -Dfile.encoding=UTF-8 -DLC_CTYPE=UTF-8 -Dsun.jnu.encoding=UTF-8 -DLOG_PATH=/data/devops/logs/${random_string} -Dlandun.env=prod -Dbuild.type=DOCKER -Ddevops.gateway=${devops_gateway}  -jar docker.jar $@ >> logs/docker.log 2>&1
    
  sleepsh.properties: |
    #!/bin/sh

    unset_proxy() {
      unset http_proxy
      unset https_proxy
      unset ftp_proxy
      unset no_proxy
      unset all_proxy
      unset HTTP_PROXY
      unset HTTPS_PROXY
      unset FTP_PROXY
      unset NO_PROXY
      unset ALL_PROXY
    }

    echo  "unset proxy"
    unset_proxy

    while true
    do
    sleep 5m
    done
---
# Source: bk-ci/charts/kubernetes-manager/templates/kubernetes-manager-configmap.yaml
#kubernetes-manager configmap
kind: ConfigMap
apiVersion: v1
metadata:
  name: kubernetes-manager
  namespace: bk-ck
  labels:
    app.kubernetes.io/instance: kubernetes-manager
    app.kubernetes.io/component: kubernetes-manager
    app.kubernetes.io/name: kubernetes-manager
data:
  config.yaml: |-
    server:
      port: 80
    
    mysql:
      dataSourceName: root:blueking@tcp(bk-ci-mysql:3306)/devops_ci_kubernetes_manager?parseTime=true&loc=Local
      connMaxLifetime: 3
      maxOpenConns: 10
      maxIdleConns: 10
    
    redis:
      addr: bk-ci-redis-master:6379
      password: blueking
      db: 0
    
    kubernetes:
      nameSpace: bk-ck

    gateway:
      # manager api服务的访问地址
      url: 127.0.0.1:30004
    
    dispatch:
      # 调度需要使用到的label，确定构建机唯一性
      label: bkci.dispatch.kubenetes/core
      # 通过k8s watch来观察构建机状态
      watch:
        task:
          label: bkci.dispatch.kubenetes/watch-task
      builder:
        # 将构建机调度到指定标签节点的配置，不填写则在集群内都可以调度，优先级小于专机和特殊机器  
        nodeSelector:
          label:
          value:
        # 构建机曾经调度过的节点名称列表
        nodesAnnotation: bkci.dispatch.kubenetes/builder-history-nodes
        # 容器历史资源使用相关
        realResource:
          # 监控构建机容器资源使用的 prometheus api地址， 字段为空则不开启realResource优化
          # 注：集群内为 <service>.<namespace>.svc.cluster.local:<port>
          prometheusUrl: 
          realResourceAnnotation: bkci.dispatch.kubenetes/builder-real-resources
      volume:
        # 构建机脚本
        builderConfigMap:
          name: dispatch-kubernetes-builder
          items:
            # 初始化脚本
            - key: initsh.properties
              path: init.sh
            # 登录调试需要的sleep脚本
            - key: sleepsh.properties
              path: sleep.sh
        hostPath:
          # 数据盘
          dataHostDir: /data/landun/workspace
          # 日志盘
          logsHostDir: /data/landun/logs
        # 应用数据使用cfs
        cfs:
          path: /data/cfs
      volumeMount:
        dataPath: /data/devops/workspace
        logPath: /data/devops/logs
        builderConfigMapPath: /data/devops/config
        cfs:
          path: /data/bkdevops/apps
          readOnly: true
      # 一些具有特定属性的机器，例如独特的网络策略
      specialMachine:
        label: bkci.dispatch.kubenetes/special-builder
      # 只给特定用户使用的专机
      privateMachine:
        label: bkci.dispatch.kubenetes/private-builder
    buildless:
      # 是否开启无编译构建集群(默认不开启)
      enabled: false
      # 无编译构建集群启动deployments数量（建议>=2）
      deploymentReplicas: 2
      # deployment配置
      buildlessDeployment:
        image: fronted-cn-beijing.cr.volces.com/container/ci:latest
        replicas: 2
        volume:
          # 构建机脚本
          builderConfigMap:
            name: buildless-builder
            items:
              # 初始化脚本
              - key: initsh.properties
                path: init.sh
          hostPath:
            # 数据盘
            dataHostDir: /data/devops/workspace
            # 日志盘
            logsHostDir: /data/devops/logs
        volumeMount:
          dataPath: /data/devops/workspace
          logPath: /data/devops/logs
          builderConfigMapPath: /data/devops/config
    buildAndPushImage:
      image: fronted-cn-beijing.cr.volces.com/container/kaniko-project/executor:v1.9.0
      # 拉取kaniko需要的凭据，如果不填视为没有
      pullImageRegistry: 
        server: 
        username: 
        password: 

    apiserver:
      auth:
        # 针对蓝盾流水线访问的超级权限token
        apiToken:
          key: Devops-Token
          value: landun
        rsaPrivateKey: |
          

    docker:
      enable: true
---
# Source: bk-ci/charts/mysql/templates/primary/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: bk-ci-mysql
  namespace: "bk-ck"
  labels:
    app.kubernetes.io/instance: bk-ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mysql
    app.kubernetes.io/version: 8.0.37
    helm.sh/chart: mysql-10.3.0
    app.kubernetes.io/component: primary
data:
  my.cnf: |-
    [mysqld]
    default_authentication_plugin=mysql_native_password
    skip-name-resolve
    explicit_defaults_for_timestamp
    basedir=/opt/bitnami/mysql
    plugin_dir=/opt/bitnami/mysql/lib/plugin
    port=3306
    socket=/opt/bitnami/mysql/tmp/mysql.sock
    datadir=/bitnami/mysql/data
    tmpdir=/opt/bitnami/mysql/tmp
    max_allowed_packet=16M
    bind-address=*
    pid-file=/opt/bitnami/mysql/tmp/mysqld.pid
    log-error=/opt/bitnami/mysql/logs/mysqld.log
    character-set-server=UTF8
    collation-server=utf8_general_ci
    max_connections=2000
    default-time-zone='+08:00'
    sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    [client]
    port=3306
    socket=/opt/bitnami/mysql/tmp/mysql.sock
    default-character-set=UTF8
    plugin_dir=/opt/bitnami/mysql/lib/plugin
    [manager]
    port=3306
    socket=/opt/bitnami/mysql/tmp/mysql.sock
    pid-file=/opt/bitnami/mysql/tmp/mysqld.pid
---
