apiVersion: v2
appVersion: v3.2.0
dependencies:
- name: common
  repository: https://charts.bitnami.com/bitnami
  version: 2.19.1
- condition: mysql.enabled
  name: mysql
  repository: https://charts.bitnami.com/bitnami
  version: 10.3.0
- condition: redis.enabled
  name: redis
  repository: https://charts.bitnami.com/bitnami
  version: 16.13.2
- condition: elasticsearch.enabled
  name: elasticsearch
  repository: https://raw.githubusercontent.com/bitnami/charts/eb5f9a9513d987b519f0ecd732e7031241c50328/bitnami
  version: 17.5.4
- condition: rabbitmq.enabled
  name: rabbitmq
  repository: https://charts.bitnami.com/bitnami
  version: 10.3.9
- condition: influxdb.enabled
  name: influxdb
  repository: https://raw.githubusercontent.com/bitnami/charts/eb5f9a9513d987b519f0ecd732e7031241c50328/bitnami
  version: 5.3.1
- condition: nginx-ingress-controller.enabled
  name: nginx-ingress-controller
  repository: https://raw.githubusercontent.com/bitnami/charts/eb5f9a9513d987b519f0ecd732e7031241c50328/bitnami
  version: 7.6.21
- condition: mongodb.enabled
  name: mongodb
  repository: https://raw.githubusercontent.com/bitnami/charts/eb5f9a9513d987b519f0ecd732e7031241c50328/bitnami
  version: 10.30.6
- condition: kubernetes-manager.enabled
  name: kubernetes-manager
  repository: file://../../helm-charts/core/ci/local_chart/kubernetes-management
  version: 0.0.45
description: A Helm chart for BlueKing CI
home: https://github.com/Tencent/bk-ci
name: bk-ci
type: application
version: v3.2.0
